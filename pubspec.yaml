name: lycanos_ai
description: "LycanOS AI — AI-powered Business Operating System for SMBs"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Immutable models / code-gen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI / UX
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  responsive_framework: ^1.4.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # PDF / printing / documents
  pdf: ^3.11.0
  printing: ^5.13.1

  # Scanning
  mobile_scanner: ^5.2.3

  # Auth / security
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1

  # Utils
  intl: ^0.19.0
  logger: ^2.4.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  collection: ^1.18.0

  cupertino_icons: ^1.0.8
  freezed: ^2.5.2
  hive_generator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.19.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  # fonts:
  #   - family: Satoshi
  #     fonts:
  #       - asset: assets/fonts/Satoshi-Regular.ttf
  #       - asset: assets/fonts/Satoshi-Bold.ttf
  #         weight: 700
