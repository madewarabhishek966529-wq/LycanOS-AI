version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lycanos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lycanos
      POSTGRES_PASSWORD: lycanos
      POSTGRES_DB: lycanos_db
    ports:
      - "5432:5432"
    volumes:
      - lycanos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lycanos -d lycanos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lycanos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lycanos_pg_data:
